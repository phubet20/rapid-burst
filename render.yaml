# Render Blueprint - backend + iPhone UI. ENGINE_MODE=cloud runs the launcher+engine beside the backend
# (MT5 via TickerAll; demo on the free plan, real needs a paid plan); ENGINE_MODE=launcher relays to a Windows launcher. Free plan sleeps when unused.
services:
  - type: web
    name: rapid-burst
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.server
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: UI_PASSWORD
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: WAKE_URL
        value: https://ntfy.sh
      - key: ENGINE_MODE
        value: cloud
      - key: TICKERALL_API_KEY
        sync: false
